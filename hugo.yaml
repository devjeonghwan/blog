baseURL: https://blog.developer-park.net/
languageCode: en-us
title: Jeonghwan Park's Dev Log
theme: "PaperMod"
enableRobotsTXT: true
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: true

languages:
  ko:
    languageName: "한국어"
    weight: 1
    params:
      homeInfoParams:
        Title: "👋 안녕하세요!"
      socialIcons:
        - name: "github"
          url: "https://github.com/devjeonghwan"
        - name: "facebook"
          url: "https://www.facebook.com/dev.parkjeonghwan"
        - name: "linkedin"
          url: "https://www.linkedin.com/in/devjeonghwan"
    menu:
      main:
        - identifier: development
          name: 개발
          url: /ko/development/
          weight: 10
        - identifier: travel
          name: 여행
          url: /ko/travel/
          weight: 20
        - identifier: notes
          name: 노트
          url: /ko/notes/
          weight: 30
        - identifier: about
          name: About
          url: /ko/about/
          weight: 40

  en:
    languageName: "English"
    weight: 2
    params:
      homeInfoParams:
        Title: "👋 Hi there!"
      socialIcons:
        - name: "github"
          url: "https://github.com/devjeonghwan"
        - name: "facebook"
          url: "https://www.facebook.com/dev.parkjeonghwan"
        - name: "linkedin"
          url: "https://www.linkedin.com/in/devjeonghwan"
    menu:
      main:
        - identifier: development
          name: Development
          url: /en/development/
          weight: 10
        - identifier: travel
          name: Travel
          url: /en/travel/
          weight: 20
        - identifier: notes
          name: Notes
          url: /en/notes/
          weight: 30
        - identifier: about
          name: About
          url: /en/about/
          weight: 40

taxonomies:
  tag: tags
  
markup:
  goldmark:
    renderer:
      unsafe: true

sitemap:
  changefreq: "weekly"
  priority: 0.5
  filename: "sitemap.xml"

params:
  comments: true
  mainSections: ["development", "travel", "notes"]

  ShowToc: true
  TocOpen: false

  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowLanguageSwitcher: true
  
  defaultTheme: auto
  disableThemeToggle: false
  disableScrollToTop: false
  disableAnchoredHeadings: false
  