{{ define "main" }}
<div class="entry-content">
    <script>
        (function() {
            const path = window.location.pathname;
            const search = window.location.search;
            const hash = window.location.hash;

            if (path.startsWith('/ko/') || path.startsWith('/en/')) {
                return; 
            }

            const newUrl = '/en' + path + search + hash;
            
            document.write('<h1>Redirecting...</h1>');
            
            window.location.replace(newUrl);
        })();
    </script>

    <noscript>
        <h1>404 Not Found</h1>
        <p>The page you requested cannot be found.</p>
    </noscript>
    
    <div id="404-content" style="display:none">
        <h1>404 Not Found</h1>
        <p>The page you requested cannot be found.</p>
        <p><a href="{{ site.Home.RelPermalink }}">Go to Home</a></p>
    </div>

    <script>
        if (window.location.pathname.startsWith('/ko/') || window.location.pathname.startsWith('/en/')) {
            document.getElementById('404-content').style.display = 'block';
        }
    </script>
</div>
{{ end }}
